<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tiếng Việt · Vietnamese Learning</title>

  <!-- Sets the dark/light attribute (from the Appearance setting) before
       first paint, so switching themes never shows a flash of the other
       one. Reads localStorage directly rather than waiting on srs.js
       (loaded later, after the stylesheet) since this has to run first. -->
  <script>
    (function () {
      var theme = 'light';
      try {
        var raw = localStorage.getItem('vn_settings_v1');
        if (raw) { var s = JSON.parse(raw); if (s && s.theme === 'dark') theme = 'dark'; }
      } catch (e) {}
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      document.addEventListener('DOMContentLoaded', function () {
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', theme === 'dark' ? '#12181a' : '#fbfbf6');
      });
    })();
  </script>

  <!-- PWA: installable, offline-capable -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#fbfbf6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tiếng Việt">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="app-title">Tiếng Việt</div>
    <!-- Populated by buildHeaderNav() in app.js from the TAB_NAV array — one
         source of truth shared with the mobile bottom nav. -->
    <nav class="tabs" id="header-tabs"></nav>
  </header>

  <main>
    <div id="tab-plan" class="tab-panel active"><!-- PlanModule --></div>
    <div id="tab-basics" class="tab-panel"><!-- BasicsModule --></div>
    <div id="tab-vocab" class="tab-panel"><!-- VocabModule --></div>
    <div id="tab-tones" class="tab-panel"><!-- TonesModule --></div>
    <div id="tab-segments" class="tab-panel"><!-- SegmentsModule --></div>
    <div id="tab-cloze" class="tab-panel"><!-- ClozeModule --></div>
    <div id="tab-grammar" class="tab-panel"><!-- GrammarModule --></div>
    <div id="tab-chunks" class="tab-panel"><!-- ChunksModule --></div>
    <div id="tab-listening" class="tab-panel"><!-- ListeningModule --></div>
    <div id="tab-speak" class="tab-panel"><!-- SpeakModule --></div>
    <div id="tab-reader" class="tab-panel"><!-- ReaderModule --></div>
    <div id="tab-stats" class="tab-panel"><!-- StatsModule --></div>
    <div id="tab-settings" class="tab-panel"><!-- SettingsModule --></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/sentences.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/telex.js"></script>
  <script src="js/vocab.js"></script>
  <script src="js/basics.js"></script>
  <script src="js/tones.js"></script>
  <script src="js/segments.js"></script>
  <script src="js/cloze.js"></script>
  <script src="js/grammar.js"></script>
  <script src="js/chunks.js"></script>
  <script src="js/listening.js"></script>
  <script src="js/speak.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/reader.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>

  <!-- Register the service worker (relative path so it works under a GitHub
       Pages subpath like /Vietnamese/). Safe to fail silently on http/file. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
