name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'icons/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'apple-touch-icon.png'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a release asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No explicit SDK-setup action: ubuntu-latest runners already ship a
      # working Android SDK (ANDROID_HOME preconfigured). android-actions/
      # setup-android@v3's default behavior additionally tries to install the
      # long-deprecated legacy "tools" package, which Google removed from the
      # SDK repository entirely — that now fails outright on current runner
      # images, even though the pre-installed SDK itself is fine for Gradle.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bundle web app into the APK assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html css js data icons manifest.webmanifest sw.js apple-touch-icon.png \
            android/app/src/main/assets/www/
          echo "Bundled files:"; ls android/app/src/main/assets/www

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/tiengviet.keystore"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/tiengviet.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk tiengviet.apk

      # A tiny sidecar the app itself fetches to check for updates, so it
      # doesn't have to download the whole APK just to learn a newer one
      # exists. Kept as its own file (not e.g. parsed from a redirect or the
      # release API) so the in-app check is a single small static fetch.
      - name: Write version marker
        run: echo -n "${{ github.run_number }}" > version.txt

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiengviet-apk
          path: tiengviet.apk

      - name: Publish to a Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android APK (latest)
          body: |
            Latest debug-signed APK of the Tiếng Việt app.
            Install on Android: download `tiengviet.apk`, open it, and allow
            installing from this source if prompted. The app itself can also
            check for and install updates from Settings.
          files: |
            tiengviet.apk
            version.txt
